name: Main CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# call-release uses softprops/action-gh-release@v2 which needs
# contents: write to create a GitHub Release. Reusable workflow
# permissions intersect with the caller's, and GitHub Actions'
# default GITHUB_TOKEN is read-only, so this grant must live here
# (release-worker.yaml declaring it upstream is not enough).
permissions:
  contents: write

jobs:
  call-docker-build:
    uses: ycpss91255-lab/base/.github/workflows/build-worker.yaml@v0.43.0-rc6
    with:
      image_name: asset_converter
      # CLI tool, no runtime image: the Dockerfile has no runtime stage.
      build_runtime: false
      # base v0.42.0: the Dockerfile has no default for TEST_TOOLS_IMAGE, but
      # build-worker's "Build devel stage" step does not pass it, so BuildKit
      # fails on the empty `FROM ${TEST_TOOLS_IMAGE}`. Pass it explicitly.
      build_args: TEST_TOOLS_IMAGE=ghcr.io/ycpss91255-lab/test-tools:latest

  call-release:
    needs: call-docker-build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ycpss91255-lab/base/.github/workflows/release-worker.yaml@v0.43.0-rc6
    with:
      archive_name_prefix: asset_converter
